# generated by ~/dev/theme-apply from ~/dev/templates — edit there, not here
set -g status-style "bg=default,fg=${fg}"
set -g status-left-length 30
set -g status-left "#[bg=${accent},fg=${bg},bold] #S #[default] "
set -g status-right "#[fg=${fg_dim}]%H:%M #[bg=${accent},fg=${bg},bold] #h "
set -g window-status-format "#[fg=${overlay}] #I #W "
set -g window-status-current-format "#[fg=${accent},bold] #I #W "
set -g pane-border-style "fg=${surface}"
set -g pane-active-border-style "fg=${accent}"
set -g message-style "bg=${surface},fg=${fg}"
set -g message-command-style "bg=${surface},fg=${fg}"
set -g mode-style "bg=${surface_alt},fg=${fg}"
set -g clock-mode-colour "${accent}"
