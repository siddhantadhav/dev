# generated by ./dev theme from ~/dev/modules/shared/lazygit/templates — edit there, not here
gui:
  theme:
    activeBorderColor:
      - "${accent}"
      - bold
    inactiveBorderColor:
      - "${overlay}"
    optionsTextColor:
      - "${blue}"
    selectedLineBgColor:
      - "${surface}"
    cherryPickedCommitBgColor:
      - "${surface_alt}"
    cherryPickedCommitFgColor:
      - "${accent}"
    unstagedChangesColor:
      - "${red}"
    defaultFgColor:
      - "${fg}"
    searchingActiveBorderColor:
      - "${yellow}"
  authorColors:
    "*": "${accent}"
