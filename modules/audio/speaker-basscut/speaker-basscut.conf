# Laptop speakers: a 24 dB/oct high-pass at 180 Hz. The speakers can't move
# enough air for bass; at high volume it makes them crackle. Loaded by the main
# PipeWire; speaker-route makes it the default output while the speakers are.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Laptop Speakers (bass cut)"
            media.name       = "Laptop Speakers (bass cut)"
            filter.graph = {
                nodes = [
                    { type = builtin name = hp1 label = bq_highpass control = { "Freq" = 180.0 "Q" = 0.707 } }
                    { type = builtin name = hp2 label = bq_highpass control = { "Freq" = 180.0 "Q" = 0.707 } }
                ]
                links = [ { output = "hp1:Out" input = "hp2:In" } ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "speaker_basscut"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name     = "speaker_basscut.output"
                node.passive  = true
                target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            }
        }
    }
]
