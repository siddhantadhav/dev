# colours ($theme_*) come from the current ~/dev theme
source = ~/.config/dev/theme/hyprlock.conf

general {
    hide_cursor = true
}

# the desktop, blurred and dimmed — same glass look as the session
background {
    monitor =
    path = screenshot
    color = $theme_bg
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    noise = 0.02
}

label {
    monitor =
    text = $TIME
    color = $theme_fg
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $theme_fg_dim
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = <i>password</i>
    outer_color = $theme_accent
    inner_color = $theme_glass
    font_color = $theme_fg
    check_color = $theme_check
    fail_color = $theme_fail
    position = 0, -40
    halign = center
    valign = center
}
