# colours ($theme_*) come from the current ~/dev theme
source = ~/.config/dev/theme/hyprlock.conf

background {
    monitor =
    color = $theme_bg
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    fade_on_empty = false
    outer_color = $theme_accent
    inner_color = $theme_surface
    font_color = $theme_fg
    check_color = $theme_check
    fail_color = $theme_fail
}
